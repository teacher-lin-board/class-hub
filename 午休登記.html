<!doctype html>
<html lang="zh-TW" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>午休秩序管理</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{font-family:'Nunito','Noto Sans TC',sans-serif}.student-ball{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;cursor:grab;transition:transform .2s,box-shadow .2s;user-select:none;background-color:#3b5998!important;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.1),inset 0 -3px 6px rgba(0,0,0,.05),inset 0 3px 6px rgba(255,255,255,.6)}.student-ball.exempt-style{background-color:#d97706!important}.student-ball:hover{transform:scale(1.1);box-shadow:0 5px 15px rgba(0,0,0,.15),inset 0 -3px 6px rgba(0,0,0,.05),inset 0 3px 6px rgba(255,255,255,.6)}.student-ball:active{cursor:grabbing}.student-ball.dragging{opacity:.5;transform:scale(1.15)}.zone{border-radius:16px;padding:16px;transition:all .3s;display:flex;flex-direction:column}.zone.drag-over{transform:scale(1.02);box-shadow:0 0 20px rgba(255,255,255,.5)}.green-zone{background:linear-gradient(135deg,#d1fae5 0%,#a7f3d0 50%,#6ee7b7 100%);border:3px solid #6ee7b7;flex:1}.yellow-zone{background:linear-gradient(135deg,#fef3c7 0%,#fde68a 50%,#fcd34d 100%);border:3px solid #fcd34d;flex:1}.yellow-sub{background:rgba(255,255,255,.5);border-radius:12px;padding:8px;flex:1;min-height:0}.red-zone{background:linear-gradient(135deg,#fed7d7 0%,#fecaca 50%,#fca5a5 100%);border:3px solid #fca5a5;flex:1}.exempt-zone{background:linear-gradient(135deg,#fed7aa 0%,#fdba74 100%);border:3px dashed #f59e0b}.next-zone{background:linear-gradient(135deg,#dbeafe 0%,#bfdbfe 100%);border:3px dashed #93c5fd}.traffic-light{width:20px;height:20px;border-radius:50%;display:inline-block;box-shadow:inset 0 -2px 4px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.1)}.clock-display{font-family:'Nunito',monospace;font-weight:800;font-size:1.5rem;background:linear-gradient(135deg,#1e293b 0%,#334155 100%);color:#4ade80;padding:8px 16px;border-radius:12px;box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 4px 8px rgba(0,0,0,.2);letter-spacing:2px}.message-input{border:2px solid #e5e7eb;border-radius:12px;padding:8px 12px;font-size:.95rem;transition:all .3s}.message-input:focus{outline:0;border-color:#60a5fa;box-shadow:0 0 12px rgba(96,165,250,.3)}.zone-title{font-weight:700;font-size:.95rem;padding:6px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;background:rgba(255,255,255,.7);width:fit-content}.balls-container{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;flex:1;overflow-y:auto}.removable-ball{cursor:pointer}.removable-ball:hover{filter:brightness(.9)}
    .sync-badge {font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px;}
    .sync-online {background-color: #d1fae5; color: #065f46;}
    .sync-offline {background-color: #fee2e2; color: #991b1b;}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-gradient-to-br from-sky-50 via-blue-50 to-emerald-50 overflow-hidden">
  <div class="w-full h-full p-4 flex flex-col gap-3">
   <header class="flex items-center justify-center gap-4 pb-2 border-b border-blue-200 flex-shrink-0 flex-wrap">
    <div class="clock-display" id="clock">
     00:00:00
    </div>
    <input type="text" id="teacherMessage" class="message-input text-center max-w-2xl flex-1" placeholder="安靜午休，好好休息！" value="安靜午休，好好休息！" style="font-size:28px;font-weight:700">
    <div class="flex items-center gap-2">
      <span id="syncStatus" class="sync-badge sync-offline">雲端連線中...</span>
      <button onclick="shareRoomLink()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs px-3 py-2 rounded-lg font-bold transition">🔗 分享房間</button>
    </div>
   </header>
   <main class="flex-1 grid grid-cols-3 gap-4 min-h-0">
    <div class="zone green-zone" id="greenZone" data-zone="green">
     <span class="zone-title text-green-700"><span class="traffic-light bg-emerald-400"></span>🌟 乖寶寶 🌟</span>
     <div class="balls-container" id="greenBalls"></div>
    </div>
    <div class="zone yellow-zone" id="yellowZone" data-zone="yellow">
     <span class="zone-title text-yellow-700"><span class="traffic-light bg-yellow-400"></span>⚠️ 注意區 ⚠️</span>
     <div class="grid grid-cols-1 gap-2 flex-1 min-h-0">
      <div class="yellow-sub" data-zone="yellow1">
       <div class="text-center text-xs font-bold text-yellow-700 mb-1">
        😅 提醒一次
       </div>
       <div class="balls-container" id="yellow1Balls"></div>
      </div>
      <div class="yellow-sub" data-zone="yellow2">
       <div class="text-center text-xs font-bold text-yellow-700 mb-1">
        📝 登記一次
       </div>
       <div class="balls-container" id="yellow2Balls"></div>
      </div>
      <div class="yellow-sub" data-zone="yellow3">
       <div class="text-center text-xs font-bold text-yellow-700 mb-1">
        📝📝 登記兩次
       </div>
       <div class="balls-container" id="yellow3Balls"></div>
      </div>
     </div>
    </div>
    <div class="zone red-zone" id="redZone" data-zone="red">
     <span class="zone-title text-red-700"><span class="traffic-light bg-red-400"></span>🚨 登記三次 🚨</span>
     <div class="balls-container" id="redBalls"></div>
    </div>
   </main>
   <div class="grid grid-cols-2 gap-4 h-24 flex-shrink-0">
    <div class="zone exempt-zone">
     <span class="zone-title text-orange-800 text-xs">🏠 不可登記區</span>
     <div class="flex items-center gap-1 mb-1"><input type="text" id="exemptInput" class="message-input flex-1 text-xs py-1 px-2" placeholder="輸入座號" style="font-size:12px"><button id="addExemptBtn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-2 py-1 rounded text-xs">新增</button>
     </div>
     <div class="balls-container" id="exemptBalls" style="gap:4px;min-height:40px"></div>
    </div>
    <div class="zone next-zone">
     <span class="zone-title text-blue-700 text-xs">📋 下次登記區</span>
     <div class="flex items-center gap-1 mb-1"><input type="text" id="nextInput" class="message-input flex-1 text-xs py-1 px-2" placeholder="輸入座號" style="font-size:12px"><button id="addNextBtn" class="bg-blue-400 hover:bg-blue-500 text-white font-bold px-2 py-1 rounded text-xs">新增</button>
     </div>
     <div class="balls-container" id="nextBalls" style="gap:4px;min-height:40px"></div>
    </div>
   </div>
   <div class="text-center"><button id="resetBtn" class="bg-gradient-to-r from-blue-300 to-blue-400 hover:from-blue-400 hover:to-blue-500 text-white font-bold px-6 py-3 rounded-full shadow-lg hover:scale-105 transition-transform">🔄 重新開始</button>
   </div>
  </div>

  <script>
    // --- Firebase 配置與初始化 ---
    // 請將下方 firebaseConfig 替換為您的 Firebase 專案設定
    const firebaseConfig = {
         apiKey: "AIzaSyAT9VXm8gf5Pn4A1iu3xXF6X8Ve9NYlUAk",
  authDomain: "teacherboard-9224d.firebaseapp.com",
  projectId: "teacherboard-9224d",
  storageBucket: "teacherboard-9224d.firebasestorage.app",
  messagingSenderId: "801036213120",
  appId: "1:801036213120:web:2077de68b0a74395023f65"
    };

    let db = null;
    let roomRef = null;
    let isCloudConnected = false;
    let roomId = 'default_nap_room';

    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
    } catch (e) {
        console.warn("Firebase 未設定或初始化失敗，系統切換為本地離線模式。");
    }

    const defaultConfig = { teacher_message: '安靜午休，好好休息！' }, totalStudents = 35;
    let studentPositions = {}, exemptStudents = [], nextRegisters = [], draggedBall = null;

    function parseRoomId() {
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room');
        if (room) roomId = room;
    }

    function shareRoomLink() {
        const url = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
        navigator.clipboard.writeText(url).then(() => alert('已複製同步房間連結！')).catch(() => prompt('請複製以下連結：', url));
    }

    function initStudents() {
        studentPositions = {};
        for (let i = 1; i <= totalStudents; i++) studentPositions[i] = 'green';
    }

    function createBall(num, isRemovable = false, isExempt = false) {
        const ball = document.createElement('div');
        ball.className = 'student-ball' + (isRemovable || isExempt ? ' removable-ball' : '') + (isExempt ? ' exempt-style' : '');
        ball.textContent = num;
        ball.dataset.student = num;
        if (isRemovable || isExempt) {
            if (isRemovable) ball.addEventListener('click', () => removeNextRegister(num));
            else ball.addEventListener('click', () => removeExemptStudent(num));
        } else {
            ball.draggable = true;
            ball.addEventListener('dragstart', handleDragStart);
            ball.addEventListener('dragend', handleDragEnd);
        }
        return ball;
    }

    function renderBalls() {
        const containers = {
            green: document.getElementById('greenBalls'),
            yellow1: document.getElementById('yellow1Balls'),
            yellow2: document.getElementById('yellow2Balls'),
            yellow3: document.getElementById('yellow3Balls'),
            red: document.getElementById('redBalls')
        };
        Object.values(containers).forEach(c => c && (c.innerHTML = ''));
        for (let num = 1; num <= totalStudents; num++) {
            const zone = studentPositions[num];
            if (containers[zone]) containers[zone].appendChild(createBall(num, false, false));
        }
    }

    function renderExemptStudents() {
        const container = document.getElementById('exemptBalls');
        container.innerHTML = '';
        exemptStudents.forEach(num => container.appendChild(createBall(num, false, true)));
    }

    function renderNextRegisters() {
        const container = document.getElementById('nextBalls');
        container.innerHTML = '';
        nextRegisters.forEach(num => container.appendChild(createBall(num, true, false)));
    }

    function handleDragStart(e) {
        draggedBall = e.target;
        e.target.classList.add('dragging');
        e.dataTransfer.setData('text/plain', e.target.dataset.student);
    }

    function handleDragEnd(e) {
        e.target.classList.remove('dragging');
        draggedBall = null;
        document.querySelectorAll('.zone, .yellow-sub').forEach(z => z.classList.remove('drag-over'));
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
        e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const studentNum = parseInt(e.dataTransfer.getData('text/plain'));
        const targetZone = e.currentTarget.dataset.zone;
        if (studentNum && targetZone && ['green', 'yellow1', 'yellow2', 'yellow3', 'red'].includes(targetZone)) {
            studentPositions[studentNum] = targetZone;
            renderBalls();
            saveData();
        }
    }

    function setupDropZones() {
        document.querySelectorAll('[data-zone="green"], [data-zone="red"], [data-zone="yellow1"], [data-zone="yellow2"], [data-zone="yellow3"]').forEach(zone => {
            zone.addEventListener('dragover', handleDragOver);
            zone.addEventListener('dragleave', handleDragLeave);
            zone.addEventListener('drop', handleDrop);
        });
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('zh-TW', { hour12: false });
    }

    function addExemptStudent() {
        const input = document.getElementById('exemptInput'), num = parseInt(input.value);
        if (num >= 1 && num <= totalStudents && !exemptStudents.includes(num)) {
            exemptStudents.push(num);
            renderExemptStudents();
            input.value = '';
            saveData();
        }
    }

    function removeExemptStudent(num) {
        const idx = exemptStudents.indexOf(num);
        if (idx !== -1) {
            exemptStudents.splice(idx, 1);
            renderExemptStudents();
            saveData();
        }
    }

    function addNextRegister() {
        const input = document.getElementById('nextInput'), num = parseInt(input.value);
        if (num >= 1 && num <= totalStudents && !nextRegisters.includes(num)) {
            nextRegisters.push(num);
            renderNextRegisters();
            input.value = '';
            saveData();
        }
    }

    function removeNextRegister(num) {
        const idx = nextRegisters.indexOf(num);
        if (idx !== -1) {
            nextRegisters.splice(idx, 1);
            renderNextRegisters();
            saveData();
        }
    }

    function resetAll() {
        initStudents();
        renderBalls();
        document.getElementById('teacherMessage').value = defaultConfig.teacher_message;
        saveData();
    }

    function saveData() {
        const payload = {
            studentPositions,
            exemptStudents,
            nextRegisters,
            teacherMessage: document.getElementById('teacherMessage').value || defaultConfig.teacher_message
        };

        localStorage.setItem('nap_state_' + roomId, JSON.stringify(payload));

        if (roomRef && isCloudConnected) {
            roomRef.set({
                ...payload,
                updatedAt: firebase.firestore.FieldValue ? firebase.firestore.FieldValue.serverTimestamp() : Date.now()
            }, { merge: true }).catch(err => console.error("雲端寫入失敗:", err));
        }
    }

    function initCloudSync() {
        const statusEl = document.getElementById('syncStatus');
        if (!db) {
            if (statusEl) { statusEl.textContent = '離線模式'; statusEl.className = 'sync-badge sync-offline'; }
            loadLocalSavedData();
            return;
        }

        roomRef = db.collection('nap_management').doc(roomId);

        roomRef.onSnapshot((doc) => {
            isCloudConnected = true;
            if (statusEl) {
                statusEl.textContent = `雲端同步中 (${roomId})`;
                statusEl.className = 'sync-badge sync-online';
            }

            if (doc.exists) {
                const data = doc.data();
                if (data.studentPositions) studentPositions = data.studentPositions;
                if (data.exemptStudents) exemptStudents = data.exemptStudents;
                if (data.nextRegisters) nextRegisters = data.nextRegisters;
                if (data.teacherMessage !== undefined) {
                    document.getElementById('teacherMessage').value = data.teacherMessage;
                }
                renderBalls();
                renderExemptStudents();
                renderNextRegisters();
            } else {
                saveData();
            }
        }, (error) => {
            console.error("Firestore 監聽失敗:", error);
            isCloudConnected = false;
            if (statusEl) {
                statusEl.textContent = '連線失敗 (離線備份)';
                statusEl.className = 'sync-badge sync-offline';
            }
            loadLocalSavedData();
        });
    }

    function loadLocalSavedData() {
        const s = localStorage.getItem('nap_state_' + roomId);
        if (s) {
            try {
                const data = JSON.parse(s);
                if (data.studentPositions) studentPositions = data.studentPositions;
                if (data.exemptStudents) exemptStudents = data.exemptStudents;
                if (data.nextRegisters) nextRegisters = data.nextRegisters;
                if (data.teacherMessage) document.getElementById('teacherMessage').value = data.teacherMessage;
            } catch (e) {
                console.error("解析本地資料失敗", e);
            }
        } else {
            initStudents();
        }
        renderBalls();
        renderExemptStudents();
        renderNextRegisters();
    }

    function init() {
        parseRoomId();
        initStudents();
        setupDropZones();
        updateClock();
        setInterval(updateClock, 1000);

        const teacherMsgInput = document.getElementById('teacherMessage');
        let msgDebounce;
        teacherMsgInput.addEventListener('input', () => {
            clearTimeout(msgDebounce);
            msgDebounce = setTimeout(saveData, 500);
        });

        document.getElementById('addExemptBtn').addEventListener('click', addExemptStudent);
        document.getElementById('exemptInput').addEventListener('keypress', e => {
            if ('Enter' === e.key) { e.preventDefault(); addExemptStudent(); }
        });

        document.getElementById('addNextBtn').addEventListener('click', addNextRegister);
        document.getElementById('nextInput').addEventListener('keypress', e => {
            if ('Enter' === e.key) { e.preventDefault(); addNextRegister(); }
        });

        document.getElementById('resetBtn').addEventListener('click', resetAll);

        initCloudSync();
    }

    init();
  </script>
 </body>
</html>
