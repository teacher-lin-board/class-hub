<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級黑板 - 聯絡簿專用版</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@600&family=Mali:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; 
            background-color: #f3f4f6; 
            overflow: hidden; 
        }
        
        /* === 黑板與聯絡簿樣式 === */
        .blackboard {
            background-color: #2b3a28;
            background-image: radial-gradient(#4a5d46 1px, transparent 1px), radial-gradient(#4a5d46 1px, transparent 1px);
            background-position: 0 0, 20px 20px; 
            background-size: 40px 40px;
            box-shadow: inset 0 0 20px #000, 5px 5px 15px rgba(0,0,0,0.3);
            border: 12px solid #8B4513; 
            border-radius: 8px; 
            color: #fff;
            font-family: 'Noto Serif TC', serif;
        }
        .chalk-text { 
            color: rgba(255, 255, 255, 0.9); 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
        }
        .chalk-input {
            background: transparent; 
            border: none; 
            border-bottom: 1px dashed rgba(255,255,255,0.3);
            color: white; 
            font-family: 'Noto Serif TC', serif; 
            width: 100%; 
            padding: 4px; 
            transition: font-size 0.2s, height 0.2s;
        }
        .chalk-input:focus { 
            outline: none; 
            border-bottom: 1px solid white; 
            background: rgba(255,255,255,0.1); 
        }
        .sticky-note { 
            background-color: #fef08a; 
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1); 
            border-radius: 4px; 
            border-top: 10px solid rgba(255,255,0,0.3); 
        }
        .duty-card { 
            background-color: #e0f2fe; 
            border-left: 4px solid #3b82f6; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1); 
            border-radius: 4px; 
        }
        @keyframes blinker { 
            50% { opacity: 0.3; color: red; } 
        }
        .blink-active { 
            animation: blinker 1.5s linear infinite; 
            font-weight: bold; 
        }
        
        /* === 通用介面樣式 === */
        .content-area { 
            height: calc(100vh - 60px); 
            overflow-y: hidden; 
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .cb-delete-btn {
            color: #f87171;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .cb-delete-btn:hover {
            color: #ef4444;
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="h-[60px] bg-white border-b shadow-sm flex items-center px-4 justify-between shrink-0 z-10">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-black text-blue-900 tracking-wide flex items-center">
                <i class="fas fa-chalkboard-teacher text-blue-600 mr-2"></i>班級雲端黑板
            </span>
        </div>
        <div class="flex items-center gap-2">
            <div id="sync-status" class="text-xs text-gray-500 flex items-center font-bold bg-gray-100 px-3 py-1.5 rounded-full transition-all">
                 <i class="fas fa-circle-notch fa-spin mr-1.5 text-blue-500"></i> 系統初始化...
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow relative bg-gray-100 flex flex-col overflow-hidden" id="main-content">
        <div class="grid grid-cols-12 gap-4 h-full p-4 content-area">
            <!-- 左側側邊欄：時鐘、值日生、老師叮嚀 -->
            <div class="col-span-12 md:col-span-3 flex flex-col gap-4 h-full">
                <!-- 時鐘卡片 -->
                <div class="bg-white p-4 rounded-xl shadow-md border-l-4 border-blue-500 shrink-0">
                    <div class="flex items-end justify-between">
                        <div>
                            <div id="clock-time" class="text-4xl font-mono font-bold text-gray-800 tracking-wider">00:00:00</div>
                            <div id="clock-date" class="text-lg text-gray-500 mt-1 font-medium">載入中...</div>
                        </div>
                        <div class="text-3xl text-blue-500"><i class="far fa-clock"></i></div>
                    </div>
                </div>

                <!-- 值日生卡片 -->
                <div class="duty-card p-3 shrink-0">
                    <h3 class="font-bold text-blue-800 text-lg mb-2 flex items-center"><i class="fas fa-user-friends mr-2"></i>今日值日生</h3>
                    <div class="flex gap-2 items-center">
                        <div class="flex-1">
                            <input type="number" id="duty-1" min="1" max="50" oninput="app.saveSettings()" class="w-full text-center text-2xl font-bold bg-white border border-blue-300 rounded py-1 focus:ring-2 focus:ring-blue-400 focus:outline-none text-blue-900" placeholder="#">
                        </div>
                        <span class="text-blue-400 font-bold">&</span>
                        <div class="flex-1">
                            <input type="number" id="duty-2" min="1" max="50" oninput="app.saveSettings()" class="w-full text-center text-2xl font-bold bg-white border border-blue-300 rounded py-1 focus:ring-2 focus:ring-blue-400 focus:outline-none text-blue-900" placeholder="#">
                        </div>
                    </div>
                </div>

                <!-- 老師叮嚀便條紙 -->
                <div class="sticky-note flex-grow flex flex-col p-4 relative min-h-0">
                    <div class="flex justify-between items-center mb-2 border-b border-yellow-400 pb-2 shrink-0">
                        <h3 class="font-bold text-gray-700 text-xl"><i class="fas fa-bullhorn mr-2"></i>老師叮嚀</h3>
                        <div class="flex gap-1 items-center bg-white/50 p-1 rounded">
                            <button onclick="app.adjustFontSize(-2)" title="縮小字體" class="text-gray-600 px-1 hover:text-black"><i class="fas fa-minus"></i></button>
                            <button onclick="app.adjustFontSize(2)" title="放大字體" class="text-gray-600 px-1 hover:text-black"><i class="fas fa-plus"></i></button>
                            <div class="w-px h-4 bg-gray-400 mx-1"></div>
                            <input type="color" id="reminder-color" title="選擇文字顏色" oninput="app.updateReminderStyle()" value="#000000" class="w-5 h-5 cursor-pointer border-0 p-0 rounded bg-transparent">
                            <button id="blink-toggle" onclick="app.toggleBlink()" title="閃爍提醒" class="text-gray-400 hover:text-red-500 transition px-1"><i class="fas fa-bolt"></i></button>
                        </div>
                    </div>
                    <textarea id="reminder-text" oninput="app.saveSettings()" class="w-full h-full bg-transparent border-none resize-none focus:ring-0 leading-relaxed" placeholder="在這裡輸入給全班的提醒事項..." style="font-size: 24px;"></textarea>
                </div>
            </div>

            <!-- 右側黑板區域：聯絡簿 + 成語 -->
            <div class="col-span-12 md:col-span-9 h-full flex flex-col">
                <div class="blackboard h-full p-6 flex flex-col relative">
                    <!-- 黑板頂部列 -->
                    <div class="flex flex-wrap justify-between items-center mb-4 border-b border-gray-600 pb-2 shrink-0">
                        <div class="flex items-center gap-4">
                            <h2 class="text-3xl font-bold text-white tracking-widest flex items-center">
                                <i class="fas fa-book-open mr-2"></i>聯絡簿
                            </h2>
                            <span id="board-date-display" class="text-2xl text-yellow-300 font-mono">--/-- (一)</span>
                        </div>
                        <div class="flex gap-4 items-center">
                            <div class="flex gap-1 bg-white/10 rounded px-2 py-1 items-center">
                                <button onclick="app.changeContactBookFontSize(-2)" class="text-white hover:text-yellow-300 px-1 text-sm"><i class="fas fa-font"></i>-</button>
                                <span class="text-xs text-gray-300">字體</span>
                                <button onclick="app.changeContactBookFontSize(2)" class="text-white hover:text-yellow-300 px-1 text-sm"><i class="fas fa-font"></i>+</button>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="app.changeWeek(-1)" class="text-gray-300 hover:text-white px-3 py-1 border border-gray-500 rounded hover:bg-white/10 text-sm transition">上週</button>
                                <button onclick="app.changeWeek(1)" class="bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-1 rounded shadow font-bold text-sm transition flex items-center">
                                    <i class="fas fa-calendar-check mr-1"></i>下週
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 星期切換頁籤 (週一 ~ 週五) -->
                    <div class="flex gap-1 mb-2 overflow-x-auto shrink-0">
                        <button id="day-btn-0" onclick="app.switchDay(0)" class="day-btn flex-1 py-1 rounded-t text-sm font-bold transition bg-white/10 text-gray-300 hover:bg-white/20">週一</button>
                        <button id="day-btn-1" onclick="app.switchDay(1)" class="day-btn flex-1 py-1 rounded-t text-sm font-bold transition bg-white/10 text-gray-300 hover:bg-white/20">週二</button>
                        <button id="day-btn-2" onclick="app.switchDay(2)" class="day-btn flex-1 py-1 rounded-t text-sm font-bold transition bg-white/10 text-gray-300 hover:bg-white/20">週三</button>
                        <button id="day-btn-3" onclick="app.switchDay(3)" class="day-btn flex-1 py-1 rounded-t text-sm font-bold transition bg-white/10 text-gray-300 hover:bg-white/20">週四</button>
                        <button id="day-btn-4" onclick="app.switchDay(4)" class="day-btn flex-1 py-1 rounded-t text-sm font-bold transition bg-white/10 text-gray-300 hover:bg-white/20">週五</button>
                    </div>

                    <!-- 聯絡簿內容區 -->
                    <div class="flex-grow flex gap-6 overflow-hidden pt-2">
                        <!-- 待辦事項列表 (左 7/12) -->
                        <div class="flex-grow flex flex-col overflow-y-auto pr-2 w-7/12" id="todo-list-container">
                            <div id="todo-list" class="space-y-3 mb-2"></div>
                            <div class="mb-4">
                                <button onclick="app.addTodoItem()" class="text-yellow-400 hover:text-yellow-200 text-sm border border-dashed border-yellow-600 hover:border-yellow-400 px-3 py-1.5 rounded transition flex items-center">
                                    <i class="fas fa-plus mr-1"></i> 新增項目
                                </button>
                            </div>
                        </div>

                        <!-- 分隔線 -->
                        <div class="w-px bg-white/10 border-l border-dashed border-gray-500/50"></div>

                        <!-- 今日成語 (右 5/12) -->
                        <div class="w-5/12 flex flex-col gap-2 min-w-[200px]">
                            <div class="bg-black/20 rounded p-2 text-center relative">
                                <label class="block text-yellow-300 text-lg mb-1 font-bold">今日成語</label>
                                <div class="absolute top-2 right-2 flex gap-1 z-10">
                                    <button onclick="app.changeIdiomFontSize(-2)" class="text-white/70 hover:text-white bg-black/30 rounded px-1.5 py-0.5 text-xs transition"><i class="fas fa-minus"></i></button>
                                    <button onclick="app.changeIdiomFontSize(2)" class="text-white/70 hover:text-white bg-black/30 rounded px-1.5 py-0.5 text-xs transition"><i class="fas fa-plus"></i></button>
                                </div>
                                <input type="text" id="idiom-input" oninput="app.delaySaveIdiom()" class="chalk-input text-2xl text-center font-bold text-yellow-100 w-full" placeholder="輸入成語">
                            </div>
                            <textarea id="idiom-desc" oninput="app.delaySaveIdiom()" class="chalk-input text-xl text-gray-200 resize-none flex-grow p-2" placeholder="在此輸入解釋或例句..."></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'class-blackboard-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyAT9VXm8gf5Pn4A1iu3xXF6X8Ve9NYlUAk",
            authDomain: "teacherboard-9224d.firebaseapp.com",
            projectId: "teacherboard-9224d",
            storageBucket: "teacherboard-9224d.firebasestorage.app",
            messagingSenderId: "801036213120",
            appId: "1:801036213120:web:2077de68b0a74395023f65"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        window.app = {
            data: {
                contactBook: {}
            },
            settings: {
                duty1: '',
                duty2: '',
                reminderText: '',
                reminderColor: '#000000',
                reminderFontSize: 24,
                reminderBlink: false,
                contactBookFontSize: 24,
                idiomFontSize: 24
            },
            currentWeekBase: null,
            currentDayIndex: 0,
            dbDocRef: null,
            user: null,

            init: async function() {
                this.currentWeekBase = this.getMonday(new Date());
                this.startClock();
                this.loadFromLocalStorage(); // 預先讀取本地暫存

                // Auth & Cloud Sync setup
                try {
                    this.updateSyncStatus('syncing', '正在連接雲端...');
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const userCred = await signInWithCustomToken(auth, __initial_auth_token);
                        this.user = userCred.user;
                    } else {
                        const userCred = await signInAnonymously(auth);
                        this.user = userCred.user;
                    }
                    
                    // 修正：Firestore document 路徑必須為偶數層級 (artifacts/appId/public/classboard_data)
                    this.dbDocRef = doc(db, 'artifacts', appId, 'public', 'classboard_data');
                    
                    // Realtime listener
                    onSnapshot(this.dbDocRef, (docSnap) => {
                        // 若為本機即時寫入觸發的回調，跳過重繪以防止打字輸入中斷
                        if (docSnap.metadata && docSnap.metadata.hasPendingWrites) {
                            return;
                        }

                        if (docSnap.exists()) {
                            const cloudData = docSnap.data();
                            if (cloudData.data) this.data = cloudData.data;
                            if (cloudData.settings) this.settings = cloudData.settings;
                            this.saveToLocalStorage();
                        }
                        this.initHomeView();
                        this.updateSyncStatus('success', '雲端同步完成');
                    }, (error) => {
                        console.error("Firestore listener error:", error);
                        this.updateSyncStatus('error', '離線模式');
                        this.initHomeView();
                    });

                } catch (e) {
                    console.warn("Firebase authentication or connection failed, using local mode.", e);
                    this.updateSyncStatus('error', '本機離線模式');
                    this.initHomeView();
                }
            },

            getMonday: function(d) {
                d = new Date(d);
                d.setHours(0, 0, 0, 0);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                return new Date(d.setDate(diff));
            },

            getDateKey: function() {
                const d = new Date(this.currentWeekBase);
                d.setDate(d.getDate() + this.currentDayIndex);
                
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            },

            initHomeView: function() {
                const sets = this.settings;
                const setVal = (id, val) => { 
                    const el = document.getElementById(id); 
                    // 若當前游標停留在該輸入框，則不強制覆蓋文字
                    if(el && document.activeElement !== el) el.value = val || ''; 
                };
                
                setVal('duty-1', sets.duty1);
                setVal('duty-2', sets.duty2);
                setVal('reminder-text', sets.reminderText);
                setVal('reminder-color', sets.reminderColor || '#000000');
                
                const rText = document.getElementById('reminder-text');
                const blinkBtn = document.getElementById('blink-toggle');
                if (rText) {
                    rText.style.color = sets.reminderColor || '#000000';
                    rText.style.fontSize = (sets.reminderFontSize || 24) + 'px';
                    if (sets.reminderBlink) {
                        rText.classList.add('blink-active');
                        if (blinkBtn) blinkBtn.classList.add('text-red-500');
                    } else {
                        rText.classList.remove('blink-active');
                        if (blinkBtn) blinkBtn.classList.remove('text-red-500');
                    }
                }

                if (this.currentDayIndex === undefined) {
                    this.currentDayIndex = 0; // 預設週一
                }

                this.updateDateDisplay();
                this.updateDayButtons();
                this.renderTodoList();
                this.renderIdiom();
            },

            startClock: function() {
                const update = () => {
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
                    const dateStr = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
                    const timeEl = document.getElementById('clock-time');
                    const dateEl = document.getElementById('clock-date');
                    if(timeEl) timeEl.innerText = timeStr;
                    if(dateEl) dateEl.innerText = dateStr;
                };
                update();
                setInterval(update, 1000);
            },

            updateDateDisplay: function() {
                if(!this.currentWeekBase) return;
                const targetDate = new Date(this.currentWeekBase);
                targetDate.setDate(targetDate.getDate() + this.currentDayIndex);
                const display = document.getElementById('board-date-display');
                const weekNames = ['(日)', '(一)', '(二)', '(三)', '(四)', '(五)', '(六)'];
                if(display) {
                    display.innerText = `${targetDate.getMonth()+1}/${targetDate.getDate()} ${weekNames[targetDate.getDay()]}`;
                }
            },
            
            changeWeek: function(offset) {
                this.currentWeekBase.setDate(this.currentWeekBase.getDate() + (offset * 7));
                this.updateDateDisplay();
                this.renderTodoList();
                this.renderIdiom();
            },

            switchDay: function(idx) {
                this.currentDayIndex = idx;
                this.updateDayButtons();
                this.updateDateDisplay();
                this.renderTodoList();
                this.renderIdiom();
            },

            updateDayButtons: function() {
                for(let i = 0; i < 5; i++) {
                    const btn = document.getElementById(`day-btn-${i}`);
                    if(!btn) continue;
                    if(i === this.currentDayIndex) {
                        btn.className = "day-btn flex-1 py-1 rounded-t text-sm font-bold transition bg-yellow-600 text-white shadow-lg transform -translate-y-0.5";
                    } else {
                        btn.className = "day-btn flex-1 py-1 rounded-t text-sm font-bold transition bg-white/10 text-gray-300 hover:bg-white/20";
                    }
                }
            },

            renderTodoList: function() {
                const activeElement = document.activeElement;
                let activeIndex = -1;
                let cursorPosition = 0;
                if (activeElement && activeElement.classList.contains('chalk-input')) {
                    activeIndex = parseInt(activeElement.getAttribute('data-idx'));
                    cursorPosition = activeElement.selectionStart;
                }

                const listEl = document.getElementById('todo-list');
                if(!listEl) return;
                listEl.innerHTML = '';
                
                const dateKey = this.getDateKey();
                const items = (this.data.contactBook && this.data.contactBook[dateKey]) ? this.data.contactBook[dateKey].items : [];
                
                items.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = "group flex items-center bg-white/10 p-2 rounded hover:bg-white/20 transition";
                    div.innerHTML = `
                        <div class="text-yellow-400 font-bold mr-3 text-xl w-6 text-center">${idx + 1}.</div>
                        <input type="text" data-idx="${idx}" class="chalk-input text-xl flex-grow ${item.done ? 'line-through text-gray-400' : ''}" 
                               value="${this.escapeHtml(item.text)}" oninput="app.updateTodoText(${idx}, this.value)" 
                               style="font-size: ${this.settings.contactBookFontSize || 24}px">
                        <i class="fas fa-trash-alt cb-delete-btn text-lg ml-2" title="刪除" onclick="app.removeTodoItem(${idx})"></i>
                    `;
                    listEl.appendChild(div);
                });

                if (activeIndex !== -1) {
                    setTimeout(() => {
                        const inputs = listEl.querySelectorAll('.chalk-input');
                        inputs.forEach(input => {
                            if (parseInt(input.getAttribute('data-idx')) === activeIndex) {
                                input.focus();
                                input.setSelectionRange(cursorPosition, cursorPosition);
                            }
                        });
                    }, 0);
                }
            },

            addTodoItem: function() {
                const dateKey = this.getDateKey();
                if (!this.data.contactBook) this.data.contactBook = {};
                if (!this.data.contactBook[dateKey]) this.data.contactBook[dateKey] = { items: [], idiom: '', idiomDesc: '' };
                
                this.data.contactBook[dateKey].items.push({ text: '', done: false });
                this.renderTodoList();
                this.saveToCloud();
            },

            removeTodoItem: function(idx) {
                const dateKey = this.getDateKey();
                if (this.data.contactBook && this.data.contactBook[dateKey]) {
                    this.data.contactBook[dateKey].items.splice(idx, 1);
                    this.renderTodoList();
                    this.saveToCloud();
                }
            },

            updateTodoText: function(idx, val) {
                const dateKey = this.getDateKey();
                if (this.data.contactBook && this.data.contactBook[dateKey]) {
                    this.data.contactBook[dateKey].items[idx].text = val;

                    if (this.todoSaveTimer) clearTimeout(this.todoSaveTimer);
                    this.todoSaveTimer = setTimeout(() => {
                        this.saveToCloud(); 
                    }, 1000);
                }
            },

            changeContactBookFontSize: function(delta) {
                let size = (this.settings.contactBookFontSize || 24) + delta;
                if(size < 12) size = 12;
                if(size > 48) size = 48;
                this.settings.contactBookFontSize = size;
                this.renderTodoList();
                this.saveSettings();
            },

            renderIdiom: function() {
                const dateKey = this.getDateKey();
                const data = (this.data.contactBook && this.data.contactBook[dateKey]) || { idiom: '', idiomDesc: '' };
                const iInput = document.getElementById('idiom-input');
                const iDesc = document.getElementById('idiom-desc');
                
                if(iInput && document.activeElement !== iInput) {
                    iInput.value = data.idiom || '';
                    iInput.style.fontSize = (this.settings.idiomFontSize || 24) + 'px';
                }
                if(iDesc && document.activeElement !== iDesc) {
                    iDesc.value = data.idiomDesc || '';
                    iDesc.style.fontSize = Math.max(14, (this.settings.idiomFontSize || 24) - 4) + 'px';
                }
            },

            delaySaveIdiom: function() {
                const dateKey = this.getDateKey();
                if (!this.data.contactBook) this.data.contactBook = {};
                if (!this.data.contactBook[dateKey]) {
                    this.data.contactBook[dateKey] = { items: [], idiom: '', idiomDesc: '' };
                }

                const iInput = document.getElementById('idiom-input');
                const iDesc = document.getElementById('idiom-desc');
                if (iInput) this.data.contactBook[dateKey].idiom = iInput.value;
                if (iDesc) this.data.contactBook[dateKey].idiomDesc = iDesc.value;

                if (this.idiomSaveTimer) clearTimeout(this.idiomSaveTimer);
                this.idiomSaveTimer = setTimeout(() => {
                    this.saveToCloud();
                }, 1000);
            },

            changeIdiomFontSize: function(delta) {
                let size = (this.settings.idiomFontSize || 24) + delta;
                if (size < 14) size = 14;
                if (size > 40) size = 40;
                this.settings.idiomFontSize = size;
                this.renderIdiom();
                this.saveSettings();
            },

            saveSettings: function() {
                const getVal = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
                this.settings.duty1 = getVal('duty-1');
                this.settings.duty2 = getVal('duty-2');
                this.settings.reminderText = getVal('reminder-text');
                this.settings.reminderColor = getVal('reminder-color') || '#000000';

                if (this.settingsSaveTimer) clearTimeout(this.settingsSaveTimer);
                this.settingsSaveTimer = setTimeout(() => {
                    this.saveToCloud();
                }, 1000);
            },

            adjustFontSize: function(delta) {
                let size = (this.settings.reminderFontSize || 24) + delta;
                if (size < 14) size = 14;
                if (size > 48) size = 48;
                this.settings.reminderFontSize = size;
                const rText = document.getElementById('reminder-text');
                if (rText) rText.style.fontSize = size + 'px';
                this.saveSettings();
            },

            updateReminderStyle: function() {
                const colorEl = document.getElementById('reminder-color');
                const rText = document.getElementById('reminder-text');
                if (colorEl && rText) {
                    rText.style.color = colorEl.value;
                    this.settings.reminderColor = colorEl.value;
                    this.saveSettings();
                }
            },

            toggleBlink: function() {
                this.settings.reminderBlink = !this.settings.reminderBlink;
                const rText = document.getElementById('reminder-text');
                const btn = document.getElementById('blink-toggle');
                if (rText) {
                    if (this.settings.reminderBlink) {
                        rText.classList.add('blink-active');
                        if (btn) btn.classList.add('text-red-500');
                    } else {
                        rText.classList.remove('blink-active');
                        if (btn) btn.classList.remove('text-red-500');
                    }
                }
                this.saveSettings();
            },

            saveToLocalStorage: function() {
                try {
                    localStorage.setItem('classboard_local_data', JSON.stringify(this.data));
                    localStorage.setItem('classboard_local_settings', JSON.stringify(this.settings));
                } catch (e) {
                    console.warn("LocalStorage save failed", e);
                }
            },

            loadFromLocalStorage: function() {
                try {
                    const localData = localStorage.getItem('classboard_local_data');
                    const localSettings = localStorage.getItem('classboard_local_settings');
                    if (localData) this.data = JSON.parse(localData);
                    if (localSettings) this.settings = JSON.parse(localSettings);
                } catch (e) {
                    console.warn("LocalStorage load failed", e);
                }
            },

            saveToCloud: async function() {
                this.saveToLocalStorage();
                if (!this.dbDocRef) return;
                try {
                    this.updateSyncStatus('syncing', '儲存中...');
                    await setDoc(this.dbDocRef, {
                        data: this.data,
                        settings: this.settings,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                    this.updateSyncStatus('success', '已同步雲端');
                } catch (e) {
                    console.error("Save to Firestore error:", e);
                    this.updateSyncStatus('error', '儲存失敗');
                }
            },

            updateSyncStatus: function(status, msg) {
                const statusEl = document.getElementById('sync-status');
                if (!statusEl) return;

                if (status === 'syncing') {
                    statusEl.className = "text-xs text-blue-700 flex items-center font-bold bg-blue-100 px-3 py-1.5 rounded-full";
                    statusEl.innerHTML = `<i class="fas fa-sync fa-spin mr-1.5"></i> ${msg}`;
                } else if (status === 'success') {
                    statusEl.className = "text-xs text-green-700 flex items-center font-bold bg-green-100 px-3 py-1.5 rounded-full";
                    statusEl.innerHTML = `<i class="fas fa-check-circle mr-1.5"></i> ${msg}`;
                } else {
                    statusEl.className = "text-xs text-amber-700 flex items-center font-bold bg-amber-100 px-3 py-1.5 rounded-full";
                    statusEl.innerHTML = `<i class="fas fa-exclamation-triangle mr-1.5"></i> ${msg}`;
                }
            },

            escapeHtml: function(str) {
                if (!str) return '';
                return str.replace(/&/g, "&amp;")
                          .replace(/</g, "&lt;")
                          .replace(/>/g, "&gt;")
                          .replace(/"/g, "&quot;")
                          .replace(/'/g, "&#039;");
            }
        };

        window.onload = function() {
            window.app.init();
        };
    </script>
</body>
</html>
