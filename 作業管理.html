        for(let n=1;n<=N;n++){
          let card=document.createElement("button"),tape=document.createElement("span"),top=document.createElement("span"),num=document.createElement("span"),status=document.createElement("span"),detail=document.createElement("span");
          card.type="button";card.className="student-card";card.dataset.student=n;card.style.animationDelay=`${Math.min(n*9,180)}ms`;
          tape.className="cell-tape";tape.ariaHidden="true";top.className="relative z-10 flex w-full items-start justify-between gap-1";
          num.className="cute-font text-base font-black tracking-tight text-slate-800";num.textContent=String(n).padStart(2,"0");
          status.className="status-badge";detail.className="detail";top.append(num,status);card.append(tape,top,detail);card.onclick=()=>this.modal(true,n);f.append(card);this.cards.set(n,{card,status,detail})
        }$("homework-grid").append(f)
      },
      pending(n){let r=this.day.records[n]||{};return this.day.items.filter(x=>r[x]===false)},
      update(){
        let total=0,students=[];
        for(let n=1;n<=N;n++){
          let pending=this.pending(n),ok=!pending.length,{card,status,detail}=this.cards.get(n);
          total+=pending.length;if(!ok)students.push(String(n).padStart(2,"0"));
          card.classList.toggle("incomplete",!ok);card.ariaLabel=`${n} 號，${ok?"已全數繳交":`缺交 ${pending.join("、")}`}`;
          status.textContent=ok?"✓ 齊":`缺 ${pending.length}`;status.className=`status-badge shrink-0 rounded-full px-1.5 py-0.5 text-[10px] font-extrabold ${ok?"bg-emerald-100 text-emerald-700":"bg-red-500 text-white"}`;
          detail.textContent=ok?"已全數繳交":pending.join("、");detail.className=`detail relative z-10 mt-1 line-clamp-2 text-[11px] ${ok?"font-medium text-slate-400":"font-bold text-red-600"}`
        }
        $("pending-count-badge").textContent=total;
        let s=$("missing-students-summary"),missing=students.length;s.textContent=missing?`缺交：${students.join("、")} 號`:"全班齊交";
        s.className=`canva-banner min-w-0 rounded-lg border px-2 py-1 ${missing?"border-red-100 bg-red-50 text-red-700":"border-emerald-100 bg-emerald-50 text-emerald-700"}`
      },
      show(id,on,focus){
        let o=$(id);o.classList.toggle("hidden",!on);o.classList.toggle("flex",on);document.body.style.overflow=on?"hidden":"";
        if(on){this.last=document.activeElement;focus&&$(focus).focus()}else if(this.last&&document.contains(this.last))this.last.focus()
      },
      modal(on,n){
        if(on){this.student=n;$("modal-student-number").textContent=String(n).padStart(2,"0");this.rows();this.show("student-modal-overlay",true,"modal-x-button")}
        else if(!$("student-modal-overlay").classList.contains("hidden")){this.show("student-modal-overlay",false);this.student=null}
      },
      rows(){
        let list=$("student-homework-list"),empty=$("student-homework-empty"),buttons=[$("student-all-complete-button"),$("student-all-missing-button")],items=this.day.items;
        empty.classList.toggle("hidden",!!items.length);buttons.forEach(b=>(b.disabled=!items.length,b.classList.toggle("opacity-50",!items.length)));
        if(!items.length)return list.replaceChildren();
        let record=this.day.records[this.student]||{};
        list.replaceChildren(...items.map((name,i)=>{
          let ok=record[name]!==false,row=document.createElement("label"),title=document.createElement("span"),right=document.createElement("span"),status=document.createElement("span"),check=document.createElement("input");
          row.className=this.rowClass(ok);title.className=this.titleClass(ok);title.textContent=name;right.className="flex shrink-0 items-center gap-2";status.className=this.statusClass(ok);status.textContent=ok?"已繳交":"缺交";
          check.id=`student-${this.student}-item-${i}`;check.type="checkbox";check.checked=ok;check.className="h-5 w-5 cursor-pointer rounded accent-emerald-600";check.ariaLabel=`${name}：${ok?"已繳交":"缺交"}`;
          check.onchange=e=>this.item(name,e.target.checked,row,status,check);right.append(status,check);row.append(title,right);return row
        }))
      },
      rowClass:ok=>`flex cursor-pointer items-center justify-between gap-3 rounded-xl border px-3 py-2 transition ${ok?"border-emerald-200 bg-emerald-50/70":"border-red-200 bg-red-50"}`,
      titleClass:ok=>`min-w-0 break-words text-sm font-bold ${ok?"text-emerald-900":"text-red-800"}`,
      statusClass:ok=>`text-[11px] font-bold ${ok?"text-emerald-700":"text-red-600"}`,
      item(name,ok,row,status,check){
        (this.day.records[this.student]??={})[name]=ok;row.className=this.rowClass(ok);row.firstChild.className=this.titleClass(ok);status.textContent=ok?"已繳交":"缺交";status.className=this.statusClass(ok);check.ariaLabel=`${name}：${ok?"已繳交":"缺交"}`;this.update();this.saveSync()
      },
      mark(ok){
        if(this.student===null||!this.day.items.length)return;let r=this.day.records[this.student]??={};this.day.items.forEach(x=>r[x]=ok);this.rows();this.update();this.toast(ok?"此學生已全部設為已繳交。":"此學生已全部設為缺交。");this.saveSync()
      },
      confirm(on){
        if(on&&!this.day.items.length)return this.toast("目前沒有作業項目可重設。");
        if(on||!$("confirm-overlay").classList.contains("hidden"))this.show("confirm-overlay",on,on?"confirm-cancel-button":null)
      },
      clear(){this.day.records=Object.create(null);this.update();this.confirm(false);this.toast("已將全班設為全數繳交。");this.saveSync()},
      summary(){
        let lines=[`【${this.date} 作業缺交名單】`];
        for(let n=1;n<=N;n++){let p=this.pending(n);if(p.length)lines.push(`${String(n).padStart(2,"0")}號：${p.join("、")}`)}
        if(lines.length===1)lines.push("全班作業皆已繳交。");return lines.join("\n")
      },
      async copy(){
        if(!this.day.items.length)return this.toast("今日尚未設定作業項目。");let text=this.summary(),ok=false;
        try{await navigator.clipboard.writeText(text);ok=true}catch(_){
          let t=document.createElement("textarea");t.value=text;t.readOnly=true;t.style.cssText="position:fixed;opacity:0";document.body.append(t);t.select();ok=document.execCommand("copy");t.remove()
        }this.toast(ok?"缺交名單已複製。":"無法複製，請稍後再試。")
      },
      toast(msg){let t=$("toast");clearTimeout(this.timer);t.textContent=msg;t.classList.add("is-visible");this.timer=setTimeout(()=>t.classList.remove("is-visible"),2400)}
    };
    addEventListener("DOMContentLoaded",()=>app.init());
  </script>
